<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guess the Disney Movie</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 20px;
    }
    .question {
      font-size: 1.5em;
      margin-bottom: 20px;
    }
    .options button {
      display: block;
      margin: 10px auto;
      padding: 10px 20px;
      font-size: 1em;
      cursor: pointer;
    }
    .result {
      margin-top: 20px;
      font-size: 1.2em;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Guess the Disney Movie</h1>
  <div class="quiz-container">
    <div class="question" id="question">Loading...</div>
    <div class="options" id="options"></div>
    <div class="result" id="result"></div>
  </div>

  <script>
    const quizData = [
      {
        question: "A magical castle with a beast living inside. Which movie is this?",
        options: ["Beauty and the Beast", "Cinderella", "Sleeping Beauty"],
        answer: "Beauty and the Beast"
      },
      {
        question: "An underwater kingdom ruled by King Triton. Which movie is this?",
        options: ["The Little Mermaid", "Moana", "Finding Nemo"],
        answer: "The Little Mermaid"
      },
      {
        question: "A jungle with a boy raised by wolves. Which movie is this?",
        options: ["The Jungle Book", "Tarzan", "The Lion King"],
        answer: "The Jungle Book"
      }
    ];

    let currentQuestionIndex = 0;

    function loadQuestion() {
      const questionElement = document.getElementById("question");
      const optionsElement = document.getElementById("options");
      const resultElement = document.getElementById("result");

      // Clear previous result
      resultElement.textContent = "";

      // Load current question
      const currentQuestion = quizData[currentQuestionIndex];
      questionElement.textContent = currentQuestion.question;

      // Load options
      optionsElement.innerHTML = "";
      currentQuestion.options.forEach(option => {
        const button = document.createElement("button");
        button.textContent = option;
        button.onclick = () => checkAnswer(option);
        optionsElement.appendChild(button);
      });
    }

    function checkAnswer(selectedOption) {
      const resultElement = document.getElementById("result");
      const currentQuestion = quizData[currentQuestionIndex];

      if (selectedOption === currentQuestion.answer) {
        resultElement.textContent = "Correct! 🎉";
      } else {
        resultElement.textContent = "Wrong! 😢 The correct answer was: " + currentQuestion.answer;
      }

      // Move to the next question after 2 seconds
      setTimeout(() => {
        currentQuestionIndex++;
        if (currentQuestionIndex < quizData.length) {
          loadQuestion();
        } else {
          showFinalMessage();
        }
      }, 2000);
    }

    function showFinalMessage() {
      const questionElement = document.getElementById("question");
      const optionsElement = document.getElementById("options");
      const resultElement = document.getElementById("result");

      questionElement.textContent = "Quiz Completed! 🎬";
      optionsElement.innerHTML = "";
      resultElement.textContent = "Thanks for playing!";
    }

    // Load the first question when the page loads
    loadQuestion();
  </script>
</body>
</html>
