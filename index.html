<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guess the Disney Movie</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #f0f8ff;
      color: #333;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #ff6f61;
      color: white;
      padding: 20px 0;
      font-size: 2em;
    }
    .quiz-container {
      max-width: 600px;
      margin: 20px auto;
      padding: 20px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }
    .question {
      font-size: 1.5em;
      margin-bottom: 20px;
    }
    .options button {
      display: block;
      margin: 10px auto;
      padding: 10px 20px;
      font-size: 1em;
      background-color: #ff6f61;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    .options button:hover {
      background-color: #e55b50;
    }
    .result {
      margin-top: 20px;
      font-size: 1.2em;
      font-weight: bold;
    }
    .progress-bar {
      height: 20px;
      background-color: #ddd;
      border-radius: 10px;
      overflow: hidden;
      margin: 20px 0;
    }
    .progress-bar-fill {
      height: 100%;
      width: 0;
      background-color: #ff6f61;
      transition: width 0.3s;
    }
    .image-container img {
      max-width: 100%;
      border-radius: 10px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <header>Guess the Disney Movie</header>
  <div class="quiz-container">
    <div class="progress-bar">
      <div class="progress-bar-fill" id="progress-bar-fill"></div>
    </div>
    <div class="image-container" id="image-container">
      <img src="" alt="Disney Scene" id="scene-image">
    </div>
    <div class="question" id="question">Loading...</div>
    <div class="options" id="options"></div>
    <div class="result" id="result"></div>
  </div>

  <script>
    const quizData = [
      {
        question: "This movie features a magical ice castle. Which movie is this?",
        image: "https://example.com/frozen.jpg", // Replace with a valid image URL
        options: ["Frozen", "Tangled", "Brave"],
        answer: "Frozen"
      },
      {
        question: "This movie is about a street rat who finds a magical lamp. Which movie is this?",
        image: "https://example.com/aladdin.jpg", // Replace with a valid image URL
        options: ["Aladdin", "The Lion King", "Mulan"],
        answer: "Aladdin"
      },
      {
        question: "This movie is about a young lion who becomes king. Which movie is this?",
        image: "https://example.com/lionking.jpg", // Replace with a valid image URL
        options: ["The Lion King", "Tarzan", "The Jungle Book"],
        answer: "The Lion King"
      },
      {
        question: "This movie features a Polynesian girl on an ocean adventure. Which movie is this?",
        image: "https://example.com/moana.jpg", // Replace with a valid image URL
        options: ["Moana", "The Little Mermaid", "Pocahontas"],
        answer: "Moana"
      }
    ];

    let currentQuestionIndex = 0;

    function loadQuestion() {
      const questionElement = document.getElementById("question");
      const optionsElement = document.getElementById("options");
      const resultElement = document.getElementById("result");
      const imageElement = document.getElementById("scene-image");
      const progressBarFill = document.getElementById("progress-bar-fill");

      // Clear previous result
      resultElement.textContent = "";

      // Load current question
      const currentQuestion = quizData[currentQuestionIndex];
      questionElement.textContent = currentQuestion.question;
      imageElement.src = currentQuestion.image;

      // Update progress bar
      const progress = ((currentQuestionIndex + 1) / quizData.length) * 100;
      progressBarFill.style.width = progress + "%";

      // Load options
      optionsElement.innerHTML = "";
      currentQuestion.options.forEach(option => {
        const button = document.createElement("button");
        button.textContent = option;
        button.onclick = () => checkAnswer(option);
        optionsElement.appendChild(button);
      });
    }

    function checkAnswer(selectedOption) {
      const resultElement = document.getElementById("result");
      const currentQuestion = quizData[currentQuestionIndex];

      if (selectedOption === currentQuestion.answer) {
        resultElement.textContent = "Correct! 🎉";
      } else {
        resultElement.textContent = "Wrong! 😢 The correct answer was: " + currentQuestion.answer;
      }

      // Move to the next question after 2 seconds
      setTimeout(() => {
        currentQuestionIndex++;
        if (currentQuestionIndex < quizData.length) {
          loadQuestion();
        } else {
          showFinalMessage();
        }
      }, 2000);
    }

    function showFinalMessage() {
      const questionElement = document.getElementById("question");
      const optionsElement = document.getElementById("options");
      const resultElement = document.getElementById("result");
      const imageContainer = document.getElementById("image-container");

      questionElement.textContent = "Quiz Completed! 🎬";
      optionsElement.innerHTML = "";
      resultElement.textContent = "Thanks for playing!";
      imageContainer.innerHTML = "";
    }

    // Load the first question when the page loads
    loadQuestion();
  </script>
</body>
</html>
